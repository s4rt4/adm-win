[workspace]
resolver = "2"
members = [
    "crates/adm-core",
    "crates/adm-ipc",
    "crates/adm-app",
    "crates/adm-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["s4rt4 <surat.sarta@gmail.com>"]

# Profil rilis: binary kecil (sesuai sasaran §1 — footprint minimum).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# panic = "unwind" (default): wndproc dibungkus catch_unwind agar panik di jalur
# paint/notify tak menyeberang FFI jadi abort senyap (bug dark-mode lama). "abort"
# akan membuat catch_unwind sia-sia, jadi sengaja TIDAK dipakai.
strip = true
